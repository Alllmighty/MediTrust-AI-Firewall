name: AI Firewall Security Audit

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install groq python-dotenv

    - name: Run LLM Observability Test Runner (10x Stress Test)
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        echo "# 🛡️ MediTrust AI Firewall / LLM OBSERVABILITY REPORT (10x CI/CD Global Summary)" >> global_report.md
        echo "Generated: $(date)" >> global_report.md
        
        FAILED=0
        
        for i in {1..3}
        do
          echo "::group::🔄 Starting global iteration №$i..."
          
          if python tests/test_runner.py; then
            echo "::endgroup::"
            echo " Iteration #$i.  Run status: ✅ SUCCESS " >> global_report.md
          else
            echo "::endgroup::"
            echo " Iteration #$i.  Run status: ❌ FLAKY " >> global_report.md
            FAILED=1
          fi
        
          if [ -f tests/test_report.md ]; then
            echo "<details><summary>🔍 Expand Iteration #$i details.</summary>" >> global_report.md
            echo "" >> global_report.md
            cat tests/test_report.md >> global_report.md
            echo "" >> global_report.md
            echo "</details>" >> global_report.md
            rm tests/test_report.md
          fi
        
          sleep 2
        done
        
        cat global_report.md >> $GITHUB_STEP_SUMMARY
        
        if [ $FAILED -ne 0 ]; then
          echo "🛑 Build blocked: Flaky results detected!"
          exit 1
        fi
        
    - name: Fallback Summary
      if: failure()
      run: |
        echo "🚨 The pipeline was forcibly stopped due to test instability." >> $GITHUB_STEP_SUMMARY